# Local development database. Production uses Neon (see README).
#
#   docker compose up -d        # start Postgres on localhost:5433
#   pnpm db:migrate:deploy      # apply migrations
#   pnpm db:seed                # load the demo catalogue, stock, journal and accounts
#
# Port 5433 avoids clashing with any Postgres already running on 5432.
services:
  db:
    image: postgres:16-alpine
    container_name: cardealership-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealership
      POSTGRES_PASSWORD: dealership
      POSTGRES_DB: dealership
    ports:
      - "5433:5432"
    volumes:
      - cardealership-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealership -d dealership"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cardealership-pgdata:
    name: cardealership-pgdata
